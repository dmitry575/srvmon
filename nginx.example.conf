# Пример подключения панели через nginx. | Example nginx front for the dashboard.
#
# Сам сервер панели слушает только 127.0.0.1 и наружу не смотрит: всё, что
# доступно снаружи, проходит через этот блок.
# The dashboard itself binds to 127.0.0.1 only; everything reachable from
# outside goes through this block.
#
# Вариант А — отдельное имя (предпочтительно). Нужна запись DNS и сертификат.
# Option A — a dedicated hostname (preferred). Requires a DNS record and a cert.

limit_req_zone $binary_remote_addr zone=srvmon_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                     # nginx < 1.25: убрать строку и добавить http2 в listen
    server_name monitor.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/srvmon.access.log;
    error_log  /var/log/nginx/srvmon.error.log warn;

    # Панель не для поисковиков и не для встраивания в чужие страницы.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 128k;
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Подбор пароля останавливаем здесь, до приложения.
    location = /api/login {
        limit_req zone=srvmon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8452;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8452;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# Вариант Б — по адресу сервера на отдельном порту, когда заводить имя незачем.
# Сертификат должен быть выписан на IP, иначе браузер будет ругаться; Let's Encrypt
# такие выдаёт. Без подходящего сертификата лучше пробросить порт по SSH:
#     ssh -L 8452:127.0.0.1:8452 you@server   и открыть http://127.0.0.1:8452
#
# Option B — by server address on a separate port, when a hostname is overkill.
# The certificate must be issued for the IP itself, otherwise the browser will
# complain; Let's Encrypt does issue those. Without a suitable certificate,
# forward the port over SSH instead:
#     ssh -L 8452:127.0.0.1:8452 you@server   then open http://127.0.0.1:8452
