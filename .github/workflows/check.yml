# A quick check of everything verifiable without a server: syntax, the example
# configuration, and completeness of the translation dictionary. The full
# suites (tools/selftest.py and tools/uitest.js) need a running dashboard and
# are meant to be run on the machine itself.
name: check

on:
  push:
    branches: [main, master]
  pull_request:
  # The release workflow runs the same checks before publishing anything
  workflow_call:

jobs:
  syntax:
    # Pinned rather than ubuntu-latest: the oldest Python the project
    # promises (3.8) is built for 24.04 but not for 26.04, which
    # ubuntu-latest moved to in November 2026 and failed this job on setup.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Python syntax
        run: python -m compileall -q server.py collector.py lib tools
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check tools/uitest.js
      - name: Shell syntax
        run: bash -n install.sh
      - name: Example configuration is valid JSON
        run: python -c "import json; json.load(open('config.example.json'))"
      - name: Every interface string has a translation
        run: python tools/checktranslations.py
